id: 004-obog-visit
short: OB・OG訪問
slides:
  - type: cover
    category: OB・OG訪問
    title: "OB・OG訪問で\n**聞くべき質問**\nリスト"
    sub: "会う前に見返したい **保存版**"
    badge: ["質問", "12選"]

  - type: lists
    heading: "**仕事内容**について"
    groups:
      - title: "リアルな働き方が見える質問"
        items:
          - "1日のスケジュールを教えてください"
          - "入社前と後で、ギャップはありましたか？"
          - "仕事でいちばんやりがいを感じる瞬間は？"
          - "若手のうちから任される仕事は？"

  - type: lists
    heading: "**キャリア・社風**について"
    groups:
      - title: "入社後をイメージできる質問"
        items:
          - "社内で活躍している人の共通点は？"
          - "異動やキャリアの選び方は？"
          - "忙しい時期と、その乗り越え方は？"
          - "この会社を選んだ決め手は何でしたか？"

  - type: lists
    heading: "**選考**と**NG質問**"
    groups:
      - title: "選考対策に活きる質問"
        items:
          - "選考ではどんな点を見られていたと思いますか？"
          - "学生時代にやっておけば良かったことは？"
      - title: "避けたいNG質問"
        ng: true
        items:
          - "HPや説明会で調べればわかること"
          - "いきなり年収や休みの話から入る"

  - type: summary
    heading: "訪問マナー\n**チェックリスト**"
    items:
      - "企業HP・記事を読んでから行く"
      - "質問は優先順位をつけて準備"
      - "5分前には到着・入室する"
      - "メモを取りながら話を聞く"
      - "お礼の連絡はその日のうちに"

caption: |
  OB・OG訪問、せっかく時間をもらったのに「何を聞けばいいか分からなかった…」とならないために☕️

  今回は、訪問で聞くべき質問を12個まとめました。

  💼 仕事内容について
  🌱 キャリア・社風について
  🎯 選考について

  ネットや説明会では聞けない「リアルな話」を聞けるのが、OB・OG訪問の最大のメリット。
  逆に、調べれば分かることを聞くのはもったいないので注意です⚠️

  訪問前に見返せるように【保存】しておいてね📌

  TSC（Tsukuba Student Community）は、筑波大生のための就活サークルです。
  先輩とつながれる機会もつくっています。フォローしてチェック🙌
hashtags: [就活, 28卒, 筑波大学, 筑波大, 就活サークル, OB訪問, OG訪問, OBOG訪問, 業界研究, 就活生と繋がりたい]
