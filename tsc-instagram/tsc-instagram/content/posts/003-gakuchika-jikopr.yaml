id: 003-gakuchika-jikopr
short: 学チカ・自己PR
slides:
  - type: cover
    category: ES・面接
    title: "学チカ・自己PR\nもう迷わない\n**書き方テンプレ**"
    title_size: 88
    sub: "そのまま使える **型と例文** つき"
    badge: ["保存版", "テンプレ"]

  - type: steps
    heading: "**学チカ**の6ステップ"
    items:
      - title: "結論"
        tag: "何に取り組んだ？"
        body: "「私は○○に力を入れました」"
      - title: "動機・目標"
        tag: "なぜ？どこを目指した？"
      - title: "課題"
        tag: "何が壁だった？"
      - title: "行動・工夫"
        tag: "いちばん厚く書く"
        body: "自分が考えて動いたことを具体的に"
      - title: "結果"
        tag: "数字で示す"
      - title: "学び"
        tag: "仕事でどう活きる？"

  - type: steps
    heading: "**自己PR**の5ステップ"
    items:
      - title: "強みを一言で"
        body: "「私の強みは○○です」"
      - title: "根拠となるエピソード"
        body: "強みが発揮された場面を1つに絞る"
      - title: "どう発揮したか"
        body: "具体的な行動・工夫を書く"
      - title: "結果"
        body: "周りの変化や数字で示す"
      - title: "入社後の活かし方"
        body: "その企業の仕事と結びつける"

  - type: example
    heading: "学チカの**例文**"
    paragraphs:
      - tag: "結論"
        text: "テニスサークルで、新入生の定着率向上に取り組みました。"
      - tag: "課題"
        text: "例年、夏までに新入生の半数が辞めてしまうことが課題でした。"
      - tag: "行動"
        text: "原因を探るため1年生10人に話を聞き、「上級生と話す機会が少ない」と分かりました。そこで**学年混合のペア練習**を提案し、毎週実施しました。"
      - tag: "結果"
        text: "夏の定着率は**50% → 80%**に向上しました。"
      - tag: "学び"
        text: "現場の声から課題を見つける大切さを学びました。"
    chars: "約200字"

  - type: summary
    heading: "話すときの**コツ**"
    items:
      - "書き言葉を、話し言葉に直す"
      - "30秒版と1分版の2つを用意する"
      - "数字や固有名詞で具体的に"
      - "「自分が何をしたか」を主語にする"
      - "丸暗記せず、要点だけ覚える"

caption: |
  ES・面接の定番「学チカ」と「自己PR」。
  何から書けばいいか迷ったら、まずは型に当てはめてみよう✍️

  📝 学チカ：結論 → 動機 → 課題 → 行動 → 結果 → 学び
  📝 自己PR：強み → エピソード → 発揮の仕方 → 結果 → 入社後

  ポイントは「行動・工夫」をいちばん厚く書くこと。
  面接官が知りたいのは、すごい結果よりも「あなたがどう考えて動いたか」です。

  例文と話し方のコツも載せているので、【保存】してES作成のお供にどうぞ📌

  TSC（Tsukuba Student Community）は、筑波大生のための就活サークルです。
  ES添削会なども開催予定！フォローしてチェックしてね🙌
hashtags: [就活, 28卒, 筑波大学, 筑波大, 就活サークル, ガクチカ, 自己PR, ES, エントリーシート, 就活生と繋がりたい]
