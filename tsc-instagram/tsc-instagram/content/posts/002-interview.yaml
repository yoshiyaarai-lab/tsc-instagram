id: 002-interview
short: 面接対策
slides:
  - type: cover
    category: 面接対策
    title: "面接で\n**通る人**と\n落ちる人の違い"
    sub: "本番までに押さえたい **3つのポイント**"
    badge: ["保存版", "3選"]

  - type: compare
    heading: "**1** 結論から話す"
    bad_label: "結論が遅い"
    bad: "私は大学1年生からサークルに所属していて、最初は人数も少なかったのですが、2年生になって…"
    good_label: "結論ファースト"
    good: "私の強みは**周りを巻き込む力**です。サークルで新歓を担当した際、…"
    why: "最初の一文で「何の話か」を伝えると、面接官は安心して聞けます。\n型は「結論 → 理由 → 具体例 → 結論」。"

  - type: lists
    heading: "**2** 深掘りに耐える準備"
    lead: "面接官は1つのエピソードを何度も「なぜ？」と掘り下げます。"
    groups:
      - title: "よく聞かれる深掘り質問"
        items:
          - "なぜそれに取り組もうと思ったの？"
          - "一番大変だったことは？"
          - "ほかにどんな選択肢があった？"
          - "今やり直すなら、何を変える？"
          - "その経験を仕事でどう活かす？"

  - type: points
    heading: "**3** 話し方と準備のコツ"
    items:
      - n: 1
        title: "1回答は1分以内"
        body: "目安は300字程度。長く話すより、聞かれたことに短く答えて会話を続ける方が印象アップ。"
      - n: 2
        title: "録画して練習する"
        body: "スマホで撮って見返すと、口ぐせ・目線・話す速さに気づけます。友達との模擬面接も効果大。"
      - n: 3
        title: "逆質問を3つ用意"
        body: "調べればわかることはNG。「若手で活躍する方の共通点は？」など、働く姿が見える質問を。"

  - type: summary
    heading: "面接前日の\n**チェックリスト**"
    items:
      - "志望動機を1分で話せる"
      - "ガクチカの深掘り5問に答えられる"
      - "企業の最新ニュースを確認した"
      - "逆質問を3つ用意した"
      - "会場・URL・持ち物を確認した"

caption: |
  「面接、何を準備すればいいかわからない…」という人へ💭

  面接で評価が分かれるのは、話の内容そのものより「伝え方」と「準備の深さ」だったりします。
  今回は面接対策で本当に大事な3つのポイントをまとめました。

  1️⃣ 結論から話す
  2️⃣ 深掘りに耐える準備をする
  3️⃣ 話し方と逆質問を整える

  最後のスライドは面接前日のチェックリストになっているので、【保存】して本番前に見返してね📌

  TSC（Tsukuba Student Community）は、筑波大生のための就活サークルです。
  模擬面接などのイベントも企画しています。フォローして最新情報をチェック🙌
hashtags: [就活, 28卒, 筑波大学, 筑波大, 就活サークル, 面接対策, 面接, 逆質問, 就活準備, 就活生と繋がりたい]
