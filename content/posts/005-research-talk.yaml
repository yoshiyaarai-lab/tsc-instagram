id: 005-research-talk
short: 理系の研究紹介
slides:
  - type: cover
    category: 理系学生必見
    title: "研究内容、\n**専門用語**で\n話してない？"
    sub: "文系の面接官にも伝わる **話し方のコツ**"
    badge: ["理系", "必見"]

  - type: steps
    heading: "伝わる研究紹介の**型**"
    items:
      - title: "ひと言で"
        tag: "何の研究？"
        body: "身近なたとえで一文にまとめる"
      - title: "背景"
        tag: "なぜ大事？"
        body: "社会や生活とのつながりを示す"
      - title: "課題"
        tag: "何が分かっていない？"
      - title: "自分の取り組み"
        tag: "いちばん大事"
        body: "工夫したこと・試行錯誤を話す"
      - title: "結果と今後"
        tag: "どこまで進んだ？"

  - type: compare
    heading: "最初の一文で**差がつく**"
    bad_label: "専門用語だらけ"
    bad: "○○基板上における△△薄膜の結晶成長条件と、その電気化学特性の相関を評価しています。"
    good_label: "誰にでも伝わる"
    good: "**スマホの電池をもっと長持ちさせる**ための、新しい材料をつくる研究をしています。"
    why: "最初は「中学生にもわかる言葉」で。興味を持ってもらえたら、深掘りで専門的な話をすればOK。"

  - type: points
    heading: "評価される**3つのコツ**"
    items:
      - n: 1
        title: "成果より「プロセス」"
        body: "うまくいかなかった時にどう考え、何を試したか。面接官はそこから仕事での姿を想像します。"
      - n: 2
        title: "「自分」を主語にする"
        body: "研究室全体の話ではなく、あなたが担当し、工夫した部分をはっきり伝えよう。"
      - n: 3
        title: "仕事とつなげる"
        body: "仮説検証力・粘り強さなど、研究で身についた力を志望企業の仕事と結びつけて締めくくる。"

  - type: summary
    heading: "想定質問に\n**答えられる？**"
    items:
      - "1分で研究内容を説明できる"
      - "なぜその研究室・テーマを選んだ？"
      - "研究でいちばん苦労したことは？"
      - "研究と志望企業の仕事の関係は？"
      - "研究以外で力を入れたことは？"

caption: |
  理系の就活で必ず聞かれる「研究内容を教えてください」🔬

  ついつい専門用語で正確に説明したくなりますが、面接官が研究分野に詳しいとは限りません。
  大事なのは「正確さ」より「伝わること」と「あなたがどう取り組んだか」です。

  ✅ 最初の一文は身近なたとえで
  ✅ 成果より、試行錯誤のプロセスを
  ✅ 自分を主語にして話す
  ✅ 研究で得た力を仕事につなげる

  最後のスライドの想定質問に答えられるか、ぜひ試してみてね。【保存】推奨です📌

  TSC（Tsukuba Student Community）は、筑波大生のための就活サークルです。
  理系・文系問わず、就活に役立つ情報を週3回発信中🙌
hashtags: [就活, 28卒, 筑波大学, 筑波大, 就活サークル, 理系就活, 研究概要, 院生就活, 面接対策, 就活生と繋がりたい]
