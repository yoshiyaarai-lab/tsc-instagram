id: 001-after-summer-intern
short: インターン後の動き方
slides:
  - type: cover
    category: サマーインターン後
    title: "インターン、\n**行って終わり**に\nなってない？"
    sub: "秋冬に差がつく **5つの行動**"
    badge: ["保存版", "5選"]

  - type: points
    heading: "まずは**振り返り**と\nつながりを残す"
    items:
      - n: 1
        title: "48時間以内に振り返る"
        body: "「学んだこと・できなかったこと・企業の印象」をメモ。時間が経つほど、ESや面接で話せる具体性が消えていきます。"
      - n: 2
        title: "お礼と接点をキープ"
        body: "お世話になった社員さんにはお礼の連絡を。座談会やリクルーター面談の案内が届くこともあるので、連絡先は大切に。"

  - type: points
    heading: "選考のチャンスを\n**見逃さない**"
    items:
      - n: 3
        title: "早期選考の案内をチェック"
        body: "参加者限定の選考ルートが案内されることも。メールとマイページはこまめに確認し、締切はカレンダーへ。"
      - n: 4
        title: "志望業界を見直す"
        body: "「合わなかった」も立派な収穫。絞るか広げるかを決めて、秋冬インターンの応募先を選び直そう。"

  - type: compare
    heading: "**5** ESの「ネタ帳」を更新する"
    bad_label: "ふわっとした書き方"
    bad: "インターンでグループワークを経験し、とても成長できました。"
    good_label: "具体的な書き方"
    good: "グループワークで進行役を担当。意見が割れた場面で**論点を3つに整理**し、時間内に提案をまとめた。この経験から、御社の企画職で…"
    why: "インターンの経験は志望動機の強い根拠になります。具体的に書けるのは、記憶が新しい**今だけ**。"

  - type: summary
    heading: "今日からできる\n**チェックリスト**"
    items:
      - "インターンの振り返りをメモした"
      - "社員さんにお礼の連絡をした"
      - "早期選考・面談の締切を確認した"
      - "秋冬インターンの応募先を決めた"
      - "ESのネタ帳に経験を書き足した"

caption: |
  サマーインターン、参加して満足していませんか？👀

  実は、インターン後の過ごし方で秋冬の選考に大きな差がつきます。
  今回は、サマーインターン後にやっておきたい5つの行動をまとめました。

  ✅ 48時間以内に振り返る
  ✅ お礼と接点をキープ
  ✅ 早期選考の案内をチェック
  ✅ 志望業界を見直す
  ✅ ESの「ネタ帳」を更新する

  あとで見返せるように【保存】しておくのがおすすめです📌

  TSC（Tsukuba Student Community）は、筑波大生のための就活サークルです。
  就活に役立つ情報を週3回発信中！気になった人はフォローしてね🙌
