name: Instagram自動投稿

on:
  schedule:
    - cron: "45 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      post_id:
        description: "投稿ID（空欄なら次の投稿）"
        required: false
        default: ""
      dry_run:
        description: "ドライラン（画像生成だけして投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 投稿する内容を決める
        id: pick
        run: |
          if [ -n "${{ inputs.post_id }}" ]; then
            echo "post_id=${{ inputs.post_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "post_id=$(python scripts/publish.py next)" >> "$GITHUB_OUTPUT"
          fi

      - name: 画像を生成
        run: python scripts/render.py "${{ steps.pick.outputs.post_id }}"

      - name: 画像をリポジトリに公開
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${{ steps.pick.outputs.post_id }}"
          git diff --cached --quiet || git commit -m "画像生成: ${{ steps.pick.outputs.post_id }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instagramに投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python scripts/publish.py publish "${{ steps.pick.outputs.post_id }}" \
            --image-base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.push.outputs.sha }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: 投稿記録を保存
        if: success()
        run: |
          git add state/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -m "投稿済み: ${{ steps.pick.outputs.post_id }}"
          git push
