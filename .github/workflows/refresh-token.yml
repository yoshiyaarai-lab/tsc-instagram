name: アクセストークンの更新

on:
  schedule:
    - cron: "17 0 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: トークンを更新してSecretsに保存
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python scripts/refresh_token.py | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
